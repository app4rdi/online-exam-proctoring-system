version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: proctor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-proctor}
      MYSQL_USER: ${DB_USER:-proctoruser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-proctorpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/proctor.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - proctor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proctor-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-proctoruser}
      DB_PASSWORD: ${DB_PASSWORD:-proctorpass}
      DB_NAME: ${DB_NAME:-proctor}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./violation_screenshots:/app/violation_screenshots
      - ./static:/app/static
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - proctor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (Optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: proctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proctor-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  proctor-network:
    driver: bridge
